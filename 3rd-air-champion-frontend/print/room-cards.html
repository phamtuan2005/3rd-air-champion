<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>TT House — room cards</title>
<!--
  The cards left in the rooms: one front per room, one back that goes behind
  any of them. Open this file in a browser and print to PDF.

  Rebuilt from the printed PDFs because the original source was never pushed.
  Each of those PDFs is a single flattened JPEG, so nothing could be recovered
  out of them — if the cards change, change THIS file and reprint from it.

  A card is not a screenshot of the app. It is an object a stranger reads in a
  room for months, and every rule below comes from that one difference.
-->
<style>
  /* 4x6in is the cheap standard photo-card size, and the 2:3 the original was
     drawn at. Change these two and the whole card rescales: every size below is
     in em, and the root em is a fraction of the card width. */
  :root { --card-w: 4in; --card-h: 6in; }

  /* The pair, scaled twice by 0.9 off the full 8in: 8 -> 7.2 -> 6.48in. That
     leaves just over an inch of margin each side, well clear of any home
     printer's unprintable edge, so the teal band running to the back card's
     edge cannot come out clipped -- the risk that made the original sheet
     landscape.

     Everything inside scales with it: the cards stay 2:3 and the type is
     proportional to this width, so it is the one number to change and nothing
     reflows. At 6.48in the cards are 3.24 x 4.86in and the type lands near
     10pt, which is about the floor for something read across a room. Going
     smaller again, set the type divisor rather than only this. */
  :root { --pair-w: 6.48in; }


  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #e5e7eb;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: #111827;
  }

  .card {
    width: var(--card-w);
    height: var(--card-h);
    font-size: calc(var(--card-w) / 24);   /* 12pt on a 4in card */
    background: #fff;
    /* The bottom padding is deliberately the deepest side. These sit in an
       acrylic holder whose wooden base swallows the bottom strip of the sheet,
       and the motto lives down there — set it flush like the other edges and
       "Your comfort. Our mission." disappears into the wood. The sides lose a
       millimetre or two to the acrylic channel, which the side padding already
       covers. */
    padding: 1.25em 1.5em 2.6em;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  /* Corner marks to cut along. The card is white to the edge, so printed on a
     letter sheet there is otherwise no line to follow — they sit exactly on the
     trim, so cutting through them removes them, and anything left is hidden
     under the acrylic lip. */
  .trim { position: absolute; inset: 0; pointer-events: none; }
  .trim i { position: absolute; width: .22in; height: .22in; border: 0 solid #b8bec7; }
  .trim i:nth-child(1) { top: 0; left: 0; border-top-width: .5pt; border-left-width: .5pt; }
  .trim i:nth-child(2) { top: 0; right: 0; border-top-width: .5pt; border-right-width: .5pt; }
  .trim i:nth-child(3) { bottom: 0; left: 0; border-bottom-width: .5pt; border-left-width: .5pt; }
  .trim i:nth-child(4) { bottom: 0; right: 0; border-bottom-width: .5pt; border-right-width: .5pt; }

  /* One Letter sheet per room, holding that room's front and back side by
     side. Cut it and that room's holder is done — no sorting a stack of loose
     cards and no chance of a room ending up with a room on both sides.

     Landscape, not portrait. The pair is 8in wide: on landscape Letter that
     leaves 1.5in each side and 1.25in top and bottom, comfortably inside any
     home printer's unprintable margin. Portrait leaves 0.25in, which is
     exactly where most printers stop — and the teal band on the back runs to
     the edge, so it would come out clipped.

     The two cards touch, so ONE cut down the middle separates them. A gutter
     between them would need two. */
  .sheet {
    width: 11in; height: 8.5in; background: #fff;
    display: flex; align-items: center; justify-content: center;
  }

  /* SHEET = "8x10": one card per portrait Letter page, at the 8x10 photo size
     so it drops straight into an 8x10 frame. The card is 4:5 here rather than
     the 2:3 of the 4x6, so it is SHORTER in proportion and the content has to
     hold at that ratio -- check a print preview after editing copy, not just
     the screen.

     8x10 on 8.5x11 leaves .25in at the sides, which is where cheap printers
     stop. That is fine because the trim marks sit ON the card edge and the
     white around it is meant to be cut away -- but tick "Actual size" / 100%
     rather than "Fit to page", or the scale is lost and it is no longer 8x10. */
  .page {
    width: 8.5in; height: 11in; background: #fff;
    display: flex; align-items: center; justify-content: center;
  }

  /* SHEET = "pair": the front and the back of ONE room on a single PORTRAIT
     Letter page, side by side at 4x6 -- 8in wide by 6in tall, inside the 8x10
     a Letter sheet actually prints. One page per room, one cut down the middle.

     The two cards touch so a single cut separates them, the same reason the
     landscape sheet has no gutter.

     The old note here rejected portrait because 8in of card on 8.5in of paper
     leaves .25in, which is where cheap printers stop, and the teal band on the
     back runs to the card edge. That risk is real and unchanged -- print one
     and look at the band before running five. If it clips, narrow --pair-w
     below to 7.5in and the pair scales down whole. */
  .duo {
    display: flex;
    width: var(--pair-w, 8in);
  }
  .duo .card {
    width: 50%;
    height: calc(var(--pair-w, 8in) * 0.75);   /* 4:6 keeps its shape */
    font-size: calc(var(--pair-w, 8in) / 48);  /* = card-w / 24 */
  }

  /* On screen everything sits on a grey desk so the trim edge is visible; in
     print the desk goes away. */
  @media screen {
    body { padding: 24px; display: flex; flex-wrap: wrap; gap: 24px; justify-content: center; }
    body.card .card, .sheet { box-shadow: 0 4px 24px rgba(0,0,0,.18); }
  }
  @media print {
    body { background: #fff; padding: 0; display: block; }
    .card, .sheet { box-shadow: none; }
    /* Whichever one IS the page is the one that breaks. */
    body.card .card { page-break-after: always; }
    body.card .card:last-child { page-break-after: auto; }
    body.letter .sheet { page-break-after: always; }
    body.letter .sheet:last-child { page-break-after: auto; }
    body.eightbyten .page { page-break-after: always; }
    body.eightbyten .page:last-child { page-break-after: auto; }
    body.pair .page { page-break-after: always; }
    body.pair .page:last-child { page-break-after: auto; }
  }

  /* ---------- front ---------- */

  .masthead { display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: .5em; }
  .brand img { width: 1.9em; height: 1.9em; }
  .brand span { font-size: 1.15em; font-weight: 700; letter-spacing: .12em; }
  .locale { font-size: .72em; letter-spacing: .22em; color: #9ca3af; text-transform: uppercase; }

  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.8em;
    line-height: 1.14;
    font-weight: 400;
    letter-spacing: -.01em;
    margin-top: .5em;
  }

  .kicker { font-size: .88em; line-height: 1.5; color: #4b5563; margin-top: .5em; }

  .panel { border: 1px solid #e5e7eb; border-radius: .65em; padding: .65em .75em; margin-top: .7em; }
  .panel-title { font-size: .95em; font-weight: 700; }

  .week { display: grid; grid-template-columns: repeat(7, 1fr); margin-top: .5em; }
  .dow { text-align: center; font-size: .68em; color: #9ca3af; padding-bottom: .3em; }

  /* The bar is drawn OVER the day cells rather than inside one, because a stay
     runs from an afternoon to a morning: it starts halfway through the arrival
     day and ends halfway through the departure day. Same geometry as the
     calendar in TiMag — if the two disagree, a guest reading both sees a gap
     between nights that is not there. */
  .days { position: relative; display: grid; grid-template-columns: repeat(7, 1fr); }
  /* The bottom padding is the lane the bar sits in. It has to clear the bar's
     own height plus its offset, or the bar is drawn through the day it is
     meant to sit under and strikes the letter out. */
  .day { text-align: center; padding: .45em 0 2.15em; font-size: 1.05em; font-weight: 700; }
  .day.free { color: #047857; }
  /* Light enough to read as unavailable, dark enough to survive a print run —
     #d1d5db looked right on a backlit screen and came off the printer as
     nothing at all, taking the strike with it. */
  .day.taken { color: #9ca3af; text-decoration: line-through; text-decoration-thickness: .07em; }
  .day.mine { color: #111827; }
  .bar-wrap { position: absolute; inset: 0; pointer-events: none; }
  /* Every one of these is a ratio taken off GuestCalendar at its reference
     tile, where the day number is 16px and the ribbon 26px:

       bar height  = 1.63 x the day number   (26/16)
       label       = 0.575 x the bar height   (13 x 1.15 boost, in a 26px bar)
       radius      = 0.31 x the bar height    (8 in 26, and never past half, or
                                               the corners meet and the bar
                                               loses the straight edge it butts
                                               against the next night with)
       gap beneath = 0.19 x the bar height    (5 in 26)

     Drawn the same height as the day letter, it stopped being a ribbon and
     read as an underline. The ribbon is meant to be the loudest thing in the
     row - the date is the quietest. */
  .bar { position: absolute; bottom: .33em; height: 1.71em; border-radius: .53em; display: flex; align-items: center; }
  /* The name is painted straight onto the bar in black — no pill behind it.
     That is what the calendar in TiBook does (text-black, px-0.5, no
     background), and a white capsule here read as a break in the bar and as an
     element the app does not have. A guest holding the card beside the app has
     to see the same object. */
  .bar b {
    font-size: .98em; font-weight: 700; color: #000; line-height: 1;
    padding: 0 .38em; white-space: nowrap;
  }
  .legend { font-size: .66em; color: #6b7280; margin-top: .6em; }

  .qr-panel {
    display: flex; align-items: center; gap: .85em;
    background: #ecfdf5; border: 1px solid #d1fae5; border-radius: .65em;
    padding: .65em; margin-top: .7em;
  }
  .qr-panel img {
    width: 4.3em; height: 4.3em; background: #fff;
    border: 1px solid #d1fae5; border-radius: .45em; padding: .3em;
  }
  .qr-head { font-size: 1.05em; font-weight: 700; color: #0f766e; line-height: 1.2; }
  .qr-sub { font-size: .78em; color: #0f766e; line-height: 1.4; margin-top: .3em; }

  .promise { margin-top: auto; padding-top: .6em; }
  .promise-label { font-size: .66em; letter-spacing: .18em; text-transform: uppercase; color: #6b7280; }
  .promise-line {
    font-family: Georgia, "Times New Roman", serif; font-style: italic;
    font-size: 1.35em; color: #5b21b6; margin-top: .2em;
  }

  /* ---------- back ---------- */

  .card.back { padding: 0; }
  .band { background: #0f766e; color: #fff; padding: .82em 1.2em; display: flex; align-items: center; gap: .7em; }
  /* The mark sits straight on the teal, untouched — which is how the TiBook
     app icon is built: the same two-tone artwork on a teal tile, no chip.
     Here the band IS the tile.

     It was white-filtered first, which welded the black house and the white
     figure inside it into one blank silhouette. Then it was put on a white
     chip to undo that, which fixed the mark and invented a white square the
     app does not have. The artwork was never the problem; both attempts were
     the background. */
  .band img { width: 2.55em; height: 2.55em; flex: none; }
  .band h2 { font-size: 1.55em; font-weight: 700; letter-spacing: -.01em; }
  .band p { font-size: .85em; opacity: .9; margin-top: .1em; }

  /* Same deep bottom as the front, for the same reason: the base eats it. */
  .back-body { padding: .95em 1.2em 2.6em; display: flex; flex-direction: column; flex: 1; }
  .feature { display: flex; gap: .6em; margin-bottom: .5em; }
  .feature svg { width: 1.3em; height: 1.3em; flex: none; stroke: #0f766e; fill: none; stroke-width: 1.7; margin-top: .15em; }
  .feature p { font-size: .88em; line-height: 1.45; color: #374151; }
  .feature b { color: #111827; }

  .chips { display: flex; flex-wrap: wrap; gap: .35em; margin-top: .4em; }
  /* The room chips carry the SAME corner as the stay ribbon on the front -
     0.31 of their own height - not the fully-round pill of TiBook's room strip.

     The app is entitled to both shapes because they live on different screens.
     A card is one object a guest turns over, so Cozy on the back and Cozy on
     the front have to read as the same thing, and side by side the pill and
     the ribbon plainly did not.

     Black label, like the ribbon. The strip's pills are white-on-colour, which
     is fine backlit and poor on paper - white on Queen's yellow barely holds
     together in ink. */
  .chip {
    font-size: .8em; font-weight: 700; color: #000;
    border-radius: .48em; padding: .18em .7em;
  }

  .tiers { border: 1px solid #e5e7eb; border-radius: .65em; padding: .65em .75em; margin-top: auto; }
  .tier-row { display: flex; justify-content: space-between; margin-top: .5em; text-align: center; }
  .tier b { display: block; font-size: .78em; border-radius: 999px; border: 1px solid; padding: .2em .6em; }
  .tier span { display: block; font-size: .7em; color: #6b7280; margin-top: .25em; }
</style>
</head>
<body>
<script>
/* ------------------------------------------------------------------ config */

/* The fault that mattered most in the printed version: the week was drawn into
   the artwork, so a card printed in September still said September in November,
   and the one thing the card sells — see what is really available — was the one
   thing it was visibly wrong about.

   Two ways out, and which you want depends on how long the card sits:

   ILLUSTRATIVE = true    no month, no dates, just weekday letters. The calendar
                          teaches a guest how to read TiBook and never expires.
                          Use this for cards that live in the rooms.

   ILLUSTRATIVE = false   real dates for the coming week, generated at the
                          moment you print. Only for a card printed and handed
                          over the same week — it goes stale exactly as fast as
                          the old one did. */
const ILLUSTRATIVE = true;

/* Straight out of util/getRoomColor.ts. King, Queen, Cozy and Cute are named
   cases there; Chill is NOT — it falls through to a hash of the room name over
   a seven-colour array, which lands on purple. Do not guess this one: if a room
   is renamed or added, run the hash. */
const ROOMS = [
  { name: "King",  color: "#ef4444" },
  { name: "Queen", color: "#eab308" },
  { name: "Cute",  color: "#22c55e" },
  { name: "Chill", color: "#a855f7" },
  { name: "Cozy",  color: "#3b82f6" },
];

/* Which of the seven cells read as taken, free, or the guest's own stay. The
   stay has to be adjacent cells: the bar is drawn from the middle of the first
   to the middle of the cell after the last. */
const PATTERN = ["taken", "free", "free", "mine", "mine", "free", "taken"];

/* The tiers and the counts that earn them are LOYALTY_TIERS in
   components/tibook/GuestLoyaltyBanner.tsx. A card promising Valued at 20 while
   the app says something else is a promise broken in print. */
const TIERS = [
  { label: "Returning", stays: "1 stay",   fg: "#15803d", bg: "#f0fdf4", bd: "#bbf7d0" },
  { label: "Loyal",     stays: "5 stays",  fg: "#1d4ed8", bg: "#eff6ff", bd: "#bfdbfe" },
  { label: "Valued",    stays: "20 stays", fg: "#7e22ce", bg: "#faf5ff", bd: "#e9d5ff" },
  { label: "Cherished", stays: "50 stays", fg: "#b45309", bg: "#fffbeb", bd: "#fde68a" },
];

/* How they come off the printer.

   "letter"  one landscape Letter sheet per room, that room's front and back
             side by side. Five sheets, one cut each. This is the one to print
             at home — the 4x6 pages otherwise come out one to a sheet, ten
             sheets with 70% of each blank.

   "card"    one 4x6 page per card, ten pages. For a print shop that takes a
             card-sized PDF and trims for you. */
const SHEET = "pair";

const LOGO = "../public/TiMagLogo.svg";
/* The QR already in the repo and already on the phones — do not crop a fresh
   one out of a printed PDF, and do not generate a second one that points
   somewhere subtly different. */
const QR = "../public/tibook-qr.svg";

/* ----------------------------------------------------------------- helpers */

const DOW = ["S", "M", "T", "W", "T", "F", "S"];

/* The coming Sunday, so a freshly printed card opens on a week that has not
   started yet. Only reached when ILLUSTRATIVE is off. */
function weekDates() {
  const d = new Date();
  d.setDate(d.getDate() + ((7 - d.getDay()) % 7 || 7));
  return Array.from({ length: 7 }, (_, i) => {
    const x = new Date(d);
    x.setDate(d.getDate() + i);
    return x;
  });
}

function calendar(room) {
  const dates = ILLUSTRATIVE ? null : weekDates();
  const title = dates ? dates[3].toLocaleString("en-US", { month: "long" }) : "Any week";
  const first = PATTERN.indexOf("mine");
  const last = PATTERN.lastIndexOf("mine");

  /* Without dates the cells ARE the weekday letters, styled free or taken, and
     the header row above them would just repeat itself — so it is dropped. A
     row of anonymous dots under a row of letters showed a guest nothing; this
     way the legend has something to point at either way. */
  const cells = PATTERN.map((state, i) =>
    '<div class="day ' + state + '">' + (dates ? dates[i].getDate() : DOW[i]) + "</div>"
  ).join("");

  /* Afternoon arrival, morning departure — and the departure day is the one
     AFTER the last night, so the bar has to reach into it.

     The 20% is not a look, it is the app's number. GuestCalendar draws the
     check-in bar from 20% of the arrival cell to its right edge, and the
     checkout cap from the left edge of the departure cell to 20% across. The
     two fractions MUST be equal: when one guest leaves on the morning another
     arrives, the cap ends exactly where the next bar begins and the changeover
     is seamless. Any other pair of numbers opens a gap or an overlap on that
     day, which is the calendar bug this house has already had.

     Drawn at half a cell each end, the stay ran to the middle of Friday and
     read as a Friday afternoon checkout. */
  const INSET = 0.2;
  const left = ((first + INSET) / 7) * 100;
  const width = ((last + 1 - first) / 7) * 100;

  return (
    '<div class="panel">' +
      '<div class="panel-title">' + title + "</div>" +
      (dates ? '<div class="week">' + DOW.map((d) => '<div class="dow">' + d + "</div>").join("") + "</div>" : "") +
      '<div class="days">' + cells +
        '<div class="bar-wrap"><div class="bar" style="left:' + left + "%;width:" + width + "%;background:" + room.color + '">' +
          "<b>" + room.name + "</b>" +
        "</div></div>" +
      "</div>" +
      /* "your stay", not "your room". With the other two words being available
         and taken, calling the bar a room left the barred nights in neither
         state, so the legend never said whether they were free. */
      '<div class="legend">Bold is available · the bar is your stay · struck is taken</div>' +
    "</div>"
  );
}

function front(room) {
  return (
    '<div class="card">' +
      '<div class="masthead">' +
        '<div class="brand"><img src="' + LOGO + '" alt="" /><span>TT HOUSE</span></div>' +
        '<div class="locale">Silicon Valley</div>' +
      "</div>" +
      "<h1>Come back to the house that knows you, and that you love.</h1>" +
      /* The printed version said "well under the Airbnb rate". Naming them on a
         card that lives in the room is written evidence of taking a guest they
         sourced off their platform, which their terms forbid, and one
         photograph is all it takes.

         But dropping the name for a bare "No service fee" threw the meaning
         out with it: a guest who does not already know a fee exists learns
         nothing from being told there is none. The saving is real and it is
         theirs - the site charges it ON THEIR BILL, and booking here removes
         it. So name the CATEGORY, not the company: "the booking sites" says
         what a guest needs and puts nothing in print that can be photographed
         and reported. */
      '<p class="kicker">Book direct through our own app. No booking-site service fee on your bill, and the rate you agree with Anh-Tuan holds every visit after.</p>' +
      calendar(room) +
      '<div class="qr-panel">' +
        '<img src="' + QR + '" alt="" />' +
        "<div>" +
          '<div class="qr-head">Point your camera here</div>' +
          '<div class="qr-sub">It opens straight to TiBook. Nothing to install.</div>' +
        "</div>" +
      "</div>" +
      '<div class="promise">' +
        /* The motto is a promise TO THE GUEST and has to be named as one, or it
           reads as a slogan about us. */
        '<div class="promise-label">Our promise to you</div>' +
        '<div class="promise-line">Your comfort. Our mission.</div>' +
      "</div>" +
    "</div>"
  );
}

const ICONS = {
  calendar: '<rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4M9 14l2 2 4-4"/>',
  chat: '<path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-6.4A8 8 0 1 1 21 12z"/>',
  tag: '<path d="M20.6 13.4 12 22l-9-9V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.3"/>',
  key: '<circle cx="7" cy="15" r="4"/><path d="M10 12 21 3M18 6l2.5 2.5M15 9l2 2"/>',
};

function feature(icon, lead, rest, extra) {
  return (
    '<div class="feature">' +
      '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">' + ICONS[icon] + "</svg>" +
      "<div><p><b>" + lead + "</b> " + rest + "</p>" + (extra || "") + "</div>" +
    "</div>"
  );
}

function back() {
  const chips = ROOMS.map(
    (r) => '<span class="chip" style="background:' + r.color + '">' + r.name + "</span>"
  ).join("");

  const tiers = TIERS.map(
    (t) =>
      '<div class="tier"><b style="color:' + t.fg + ";background:" + t.bg + ";border-color:" + t.bd + '">' +
      t.label + "</b><span>" + t.stays + "</span></div>"
  ).join("");

  return (
    '<div class="card back">' +
      '<div class="band">' +
        '<img src="' + LOGO + '" alt="" />' +
        "<div><h2>TiBook</h2><p>TT House’s own booking app</p></div>" +
      "</div>" +
      '<div class="back-body">' +
        feature("calendar", "See what’s really available.", "All five rooms, night by night:", '<div class="chips">' + chips + "</div>") +
        feature("chat", "Say it in your own words.", "“Next Friday, three nights” is enough.") +
        feature("tag", "Book direct.", "No booking-site service fee on your bill, and the rate you agree with Anh-Tuan holds every visit after.") +
        /* Written as what the guest RECEIVES, not as something automatic.
           There is no scheduler behind the reminder - TiMag raises it as a to-do
           and the host presses send. From the guest's chair the experience is
           the same, but a card promising the house sends it by itself is a
           promise a forgotten button breaks.
           "calendar" came out rather than the line growing: the first feature
           on this card is already the calendar. */
        feature("key", "The whole stay in one place.", "Door code, directions, and a text before you arrive.") +
        '<div class="tiers">' +
          '<div class="panel-title">The house keeps count.</div>' +
          '<div class="tier-row">' + tiers + "</div>" +
        "</div>" +
        '<div class="qr-panel">' +
          '<img src="' + QR + '" alt="" />' +
          "<div>" +
            '<div class="qr-head">Scan to open TiBook</div>' +
            '<div class="qr-sub">No app to install and no password. It knows you by your phone number.</div>' +
          "</div>" +
        "</div>" +
      "</div>" +
    "</div>"
  );
}

/* One holder per room, and each holder is double-sided — so each room needs its
   OWN copy of the back, and the two sheets go in back to back.

   Hence pairs: King front, back, Queen front, back, and so on. Printed as five
   fronts followed by a single back, cutting the stack in half gave you one
   usable holder and four with a room on both sides. Two separate sheets rather
   than one duplexed sheet on purpose: nothing has to line up through the paper,
   and any printer can do it. */
const TRIM = '<div class="trim"><i></i><i></i><i></i><i></i></div>';
const withTrim = (html) => html.replace(/^(<div class="card[^"]*">)/, "$1" + TRIM);

const PAGE_SIZE = {
  letter: "11in 8.5in",   // landscape, front + back side by side
  "8x10": "8.5in 11in",   // portrait, one 8x10 card per page
  pair: "8.5in 11in",     // portrait, this room's front + back on one page
  card: "4in 6in",        // the bare card, for a print shop
};
document.head.insertAdjacentHTML(
  "beforeend",
  `<style>@page { size: ${PAGE_SIZE[SHEET] || PAGE_SIZE.card}; margin: 0; }</style>`
);
// The whole card is sized off --card-w, so the 8x10 is that one line and not a
// second layout to keep in step with the first.
if (SHEET === "8x10") {
  document.head.insertAdjacentHTML(
    "beforeend",
    // The type divisor rises with the ratio. The card is drawn 2:3; 8x10 is
    // 4:5, so it is proportionally SHORTER and the same copy at /24 runs about
    // 18% past the bottom edge -- measured, not guessed. /29 is the largest
    // that still fits with the deep bottom padding intact, and 8in/29 is still
    // ~20pt, well above the 12pt the 4x6 reads at.
    "<style>:root { --card-w: 8in; --card-h: 10in; }" +
      ".card { font-size: calc(var(--card-w) / 29); }</style>"
  );
}
document.body.className = SHEET === "8x10" ? "eightbyten" : SHEET;
document.body.innerHTML = ROOMS
  .map((room) => {
    const f = withTrim(front(room));
    const b = withTrim(back());
    if (SHEET === "letter") return `<div class="sheet">${f + b}</div>`;
    // Front and back each get their own page: an 8x10 pair will not sit side
    // by side on any sheet a home printer takes.
    if (SHEET === "8x10") return `<div class="page">${f}</div><div class="page">${b}</div>`;
    if (SHEET === "pair") return `<div class="page"><div class="duo">${f + b}</div></div>`;
    return f + b;
  })
  .join("");
</script>
</body>
</html>
